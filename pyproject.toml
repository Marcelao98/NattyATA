[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natty-ata"
version = "0.7.0"
description = "Transcreve vídeos do YouTube e arquivos de áudio (legenda ou faster-whisper). Parte do ecossistema da Natty."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# numpy já vem com o faster-whisper; listado porque o código importa direto.
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy",
    # [default] traz o yt-dlp-ejs, que resolve o desafio JavaScript do YouTube.
    "yt-dlp[default]",
]

[project.optional-dependencies]
# Gravação do áudio do PC (só Windows): `pip install -e ".[gravacao]"`.
gravacao = ["pyaudiowpatch; sys_platform == 'win32'"]

[project.scripts]
ata = "natty_ata.cli:main"

[tool.setuptools]
packages = ["natty_ata"]
