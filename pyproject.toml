[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vatty"
version = "0.11.0"
description = "Vatty (Video Audio To Almost Everything): transforma vídeos, áudios e gravações em texto (legenda ou faster-whisper) e deixa agentes do Claude Code fazerem o resto. Filha do ouvido da Natty."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# numpy já vem com o faster-whisper; listado porque o código importa direto.
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy",
    # [default] traz o yt-dlp-ejs, que resolve o desafio JavaScript do YouTube.
    "yt-dlp[default]",
]

[project.optional-dependencies]
# Gravação do áudio do PC (só Windows): `pip install -e ".[gravacao]"`.
gravacao = ["pyaudiowpatch; sys_platform == 'win32'"]

[project.scripts]
vatty = "vatty.cli:main"
# apelido antigo, para não quebrar o que já estava em uso
ata = "vatty.cli:main"

[tool.setuptools]
packages = ["vatty"]
