  <rect x="78" y="150" width="44" height="24" rx="5" fill="#3a3358" stroke="#4a4268" stroke-width="2"/>
  <circle cx="91" cy="162" r="6" fill="#3fd6c3"/><circle cx="109" cy="162" r="6" fill="#3fd6c3"/>
  <path d="M91 162h18" stroke="#10241f" stroke-width="2"/>
  <!-- antena -->
  <path d="M100 42V22" stroke="#b9b0cf" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="18" r="6" fill="#ffb347"/>
  <!-- cabeça -->
  <rect x="48" y="40" width="104" height="92" rx="30" fill="#3a3358" stroke="#ffb347" stroke-width="2.5" stroke-dasharray="6 5"/>
