  <g fill="#3fd6c3">
    <rect x="73" y="80" width="4" height="12" rx="2"/><rect x="80" y="74" width="4" height="24" rx="2"/><rect x="87" y="78" width="4" height="16" rx="2"/>
    <rect x="109" y="78" width="4" height="16" rx="2"/><rect x="116" y="74" width="4" height="24" rx="2"/><rect x="123" y="80" width="4" height="12" rx="2"/>
  </g>
  <path d="M93 102q7 5 14 0" stroke="#ff5c9e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- fones grandes: o ouvido impecável -->
